name: miniproject_timetable_manager
description: "SchedIQ — Smart Timetable Manager with attendance, notifications, and PDF export."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  flutter_local_notifications: ^21.0.0
  provider: ^6.1.1
  intl: ^0.19.0
  timezone: ^0.11.0
  google_fonts: ^6.1.0
  path: ^1.9.0
  # V2 additions
  shared_preferences: ^2.3.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
